<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三生三世 · 我們的婚禮 2027.04.17</title>
<meta name="description" content="2027.04.17 川門子 午宴 — 三生三世電子喜帖">
<meta name="theme-color" content="#0E1220">

<!-- 分享用 OG（圖片路徑在 data.js 的 share.image，換好圖後把下面 og:image 一併改成絕對網址） -->
<meta property="og:type" content="website">
<meta property="og:title" content="三生三世 · 我們的婚禮">
<meta property="og:description" content="2027.04.17 川門子 午宴">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   main.css
   0 封面 / 1 繪本 / 2 時間軸 / 3 婚禮資訊 / 4 RSVP / 5 祝福牆 / 6 倒數 / 7 頁尾
   ========================================================================= */
:root{
  --ink:#1B2340;
  --paper:#F2EBDD;
  --paper-2:#E9E0CE;
  --thread:#C7343F;
  --gold:#C9A227;
  --night:#0E1220;
  --edge:rgba(27,35,64,.16);
  --muted:rgba(27,35,64,.62);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{background:var(--night);}
body{
  font-family:"Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100%;}
img{max-width:100%;display:block;}
a{color:inherit;}

.serif{font-family:"Noto Serif TC",serif;}
.vtext{writing-mode:vertical-rl;text-orientation:upright;font-family:"Noto Serif TC",serif;}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ========== 共用區塊 ========== */
.sheet{
  position:relative;
  background:var(--paper);
  padding:clamp(64px,11vh,120px) clamp(20px,6vw,64px);
}
.sheet--alt{background:var(--paper-2);}
.wrap{max-width:860px;margin:0 auto;}
.sec-head{text-align:center;margin-bottom:clamp(38px,7vh,68px);}
.sec-kicker{
  font-size:.66rem;letter-spacing:.5em;text-indent:.5em;
  color:var(--gold);font-weight:500;
}
.sec-title{
  font-family:"Noto Serif TC",serif;font-weight:500;
  font-size:clamp(1.5rem,4.4vw,2.1rem);letter-spacing:.3em;text-indent:.3em;
  margin-top:12px;
}
.sec-title::after{
  content:"";display:block;width:34px;height:1px;
  background:var(--thread);margin:18px auto 0;
}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
.reveal.in{opacity:1;transform:none;}

/* ========== 0 封面 ========== */
#cover{
  position:fixed;inset:0;z-index:120;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(22px,4vh,38px);
  background:#12172A;
  transition:opacity .9s ease,visibility .9s;
}
#cover.gone{opacity:0;visibility:hidden;pointer-events:none;}
#coverTitle{
  font-family:"Noto Serif TC",serif;font-weight:300;
  font-size:clamp(1.5rem,5vw,2.3rem);letter-spacing:.7em;
  color:var(--paper);text-indent:.7em;
}
/* 首屏 3 秒內必須看到日期 */
#coverDate{
  text-align:center;color:var(--paper);
  font-family:"Noto Serif TC",serif;
}
#coverDate .d{
  font-size:clamp(1.9rem,7.4vw,3rem);font-weight:300;
  letter-spacing:.16em;color:var(--gold);
}
#coverDate .sub{
  margin-top:12px;font-size:.76rem;letter-spacing:.34em;
  color:rgba(242,235,221,.72);font-family:"Noto Sans TC",sans-serif;
}
#coverNames{
  font-family:"Noto Serif TC",serif;font-size:.94rem;
  letter-spacing:.44em;text-indent:.44em;color:rgba(242,235,221,.86);
}
#open{
  appearance:none;cursor:pointer;
  background:transparent;color:var(--thread);
  border:1px solid rgba(199,52,63,.5);border-radius:2px;
  font-family:"Noto Serif TC",serif;font-size:.86rem;
  letter-spacing:.42em;text-indent:.42em;padding:14px 30px;
  transition:background .3s ease,color .3s ease;
}
#open:hover,#open:focus-visible{background:var(--thread);color:var(--paper);outline:none;}
#coverLoad{
  font-size:.64rem;letter-spacing:.3em;color:rgba(242,235,221,.4);
  min-height:1em;
}

/* ========== 1 立體繪本 ========== */
/* 外層拉高 → 內層 sticky 釘住；用捲動位置決定第幾世，不劫持滾輪 */
#chapters{position:relative;height:340vh;background:var(--night);}
#book{
  position:sticky;top:0;height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(10px,2.5vw,28px);
}
#page{
  position:relative;width:100%;height:100%;max-width:1500px;
  border-radius:6px;overflow:hidden;background:var(--night);
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(242,235,221,.12);
}
#stage{display:block;width:100%;height:100%;}
#grain{
  position:absolute;inset:0;pointer-events:none;
  mix-blend-mode:multiply;opacity:.30;background-image:var(--grain);
}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 clamp(60px,12vw,180px) rgba(14,18,32,.62);
}
#spine{
  position:absolute;top:0;bottom:0;left:50%;
  width:44px;margin-left:-22px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(14,18,32,.14) 42%,
    rgba(14,18,32,.22) 50%,rgba(14,18,32,.14) 58%,transparent);
  opacity:.75;
}
@media (max-width:760px){#spine{display:none;}}

#titleWrap{
  position:absolute;top:clamp(22px,5vh,60px);left:clamp(20px,4vw,58px);
  pointer-events:none;z-index:5;
}
#era{
  font-size:.72rem;letter-spacing:.55em;font-weight:300;
  color:var(--gold);margin-bottom:14px;opacity:.9;
}
#chapter{
  font-size:clamp(2.6rem,7vw,4.1rem);font-weight:500;
  letter-spacing:.32em;color:var(--paper);
  text-shadow:0 2px 24px rgba(0,0,0,.55);
}
#place{
  font-size:.78rem;letter-spacing:.42em;font-weight:300;
  color:rgba(242,235,221,.68);margin-top:16px;
}
#era,#chapter,#place{transition:opacity .5s ease,transform .5s ease;}
#titleWrap.swap #era,#titleWrap.swap #chapter,#titleWrap.swap #place{
  opacity:0;transform:translateY(14px);
}
#line{
  position:absolute;right:clamp(20px,4vw,58px);bottom:clamp(84px,14vh,120px);
  max-width:min(19ch,44vw);text-align:right;z-index:5;pointer-events:none;
  font-family:"Noto Serif TC",serif;font-weight:300;
  font-size:clamp(.92rem,1.9vw,1.12rem);line-height:2.1;letter-spacing:.14em;
  color:rgba(242,235,221,.9);text-shadow:0 2px 18px rgba(0,0,0,.6);
  transition:opacity .5s ease,transform .5s ease;
}
#line.swap{opacity:0;transform:translateY(14px);}

#nav{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:clamp(24px,4.5vh,40px);z-index:6;
  display:flex;align-items:center;gap:0;
}
.knot{appearance:none;border:0;background:none;cursor:pointer;padding:14px 4px;position:relative;}
.knot i{
  display:block;width:11px;height:11px;border-radius:2px;transform:rotate(45deg);
  border:1.5px solid rgba(199,52,63,.55);background:transparent;transition:all .35s ease;
}
.knot[aria-current="true"] i{
  background:var(--thread);border-color:var(--thread);
  box-shadow:0 0 14px rgba(199,52,63,.75);
}
.thread{width:clamp(44px,9vw,74px);height:1px;background:rgba(199,52,63,.45);}
.knot:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;}

#hint{
  position:absolute;right:clamp(20px,4vw,58px);bottom:clamp(26px,4.5vh,42px);
  z-index:6;font-size:.68rem;letter-spacing:.3em;font-weight:300;
  color:rgba(242,235,221,.42);
}
@media (max-width:640px){#hint{display:none;}}

/* WebGL 失敗時的靜態備援 */
#page.nogl #stage{display:none;}
#page.nogl{background:var(--fallback,#12172A);transition:background .8s ease;}

/* ========== 常駐 RSVP 浮動鈕 ========== */
#rsvpFab{
  position:fixed;z-index:90;
  right:clamp(14px,3vw,26px);top:clamp(14px,3vh,24px);
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:999px;
  background:var(--thread);color:var(--paper);
  border:0;cursor:pointer;text-decoration:none;
  font-size:.78rem;letter-spacing:.24em;text-indent:.24em;
  font-family:"Noto Serif TC",serif;
  box-shadow:0 6px 22px rgba(199,52,63,.42);
  opacity:0;transform:translateY(-10px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease,background .3s ease;
}
#rsvpFab.show{opacity:1;transform:none;pointer-events:auto;}
#rsvpFab:hover,#rsvpFab:focus-visible{background:#a92a34;outline:none;}
@media (max-width:640px){
  #rsvpFab{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;padding:12px 20px;}
}

/* ========== 2 時間軸 ========== */
#tl{position:relative;list-style:none;padding-left:34px;}
#tl::before{
  content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(180deg,transparent,var(--thread) 12%,var(--thread) 88%,transparent);
  opacity:.55;
}
#tl li{position:relative;padding-bottom:clamp(30px,5vh,46px);}
#tl li:last-child{padding-bottom:0;}
#tl li::before{
  content:"";position:absolute;left:-34px;top:7px;
  width:11px;height:11px;transform:rotate(45deg);border-radius:2px;
  border:1.5px solid var(--thread);background:var(--paper);
}
#tl li.now::before{background:var(--thread);box-shadow:0 0 12px rgba(199,52,63,.5);}
.tl-date{font-size:.68rem;letter-spacing:.26em;color:var(--gold);min-height:1em;}
.tl-label{
  font-family:"Noto Serif TC",serif;font-size:1.16rem;
  letter-spacing:.24em;margin:6px 0 8px;
}
.tl-text{font-size:.92rem;line-height:2;color:var(--muted);letter-spacing:.06em;}

/* ========== 3 婚禮資訊 ========== */
.info{display:grid;gap:14px;}
.row{
  display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:start;
  padding:16px 18px;background:rgba(255,255,255,.5);
  border:1px solid var(--edge);border-radius:3px;
}
.row dt{
  font-family:"Noto Serif TC",serif;font-size:.78rem;
  letter-spacing:.24em;color:var(--muted);padding-top:3px;
}
.row dd{font-size:.98rem;line-height:1.95;letter-spacing:.05em;user-select:text;}
.row dd .big{font-size:1.14rem;letter-spacing:.1em;}
.row dd .sub{display:block;font-size:.82rem;color:var(--muted);margin-top:4px;}
.row dd .tbd{color:var(--thread);font-size:.86rem;}
.copy{
  appearance:none;border:1px solid var(--edge);background:transparent;
  border-radius:2px;cursor:pointer;padding:6px 10px;
  font-size:.68rem;letter-spacing:.16em;color:var(--muted);
  transition:all .25s ease;white-space:nowrap;
}
.copy:hover,.copy:focus-visible{border-color:var(--thread);color:var(--thread);outline:none;}
.copy.done{border-color:var(--gold);color:var(--gold);}
.map-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 22px;border-radius:2px;cursor:pointer;text-decoration:none;
  font-family:"Noto Serif TC",serif;font-size:.82rem;
  letter-spacing:.26em;text-indent:.26em;
  border:1px solid var(--thread);color:var(--thread);background:transparent;
  transition:background .3s ease,color .3s ease;
}
.btn:hover,.btn:focus-visible{background:var(--thread);color:var(--paper);outline:none;}
.btn--solid{background:var(--thread);color:var(--paper);}
.btn--solid:hover,.btn--solid:focus-visible{background:#a92a34;}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none;}
#mapFrame{
  margin-top:22px;border:1px solid var(--edge);border-radius:3px;overflow:hidden;
  aspect-ratio:16/9;background:var(--paper-2);
}
#mapFrame iframe{width:100%;height:100%;border:0;display:block;}

/* ========== 4 RSVP ========== */
#rsvpBox{border:1px solid var(--edge);border-radius:3px;background:rgba(255,255,255,.5);overflow:hidden;}
#rsvpBox iframe{width:100%;height:min(1100px,150vh);border:0;display:block;background:#fff;}
.fallback{padding:clamp(28px,6vw,48px);text-align:center;}
.fallback p{font-size:.92rem;line-height:2.1;color:var(--muted);letter-spacing:.06em;}
.fallback .note{
  margin-top:18px;font-size:.76rem;letter-spacing:.16em;
  color:var(--thread);
}
.deadline{
  margin-top:18px;text-align:center;font-size:.78rem;
  letter-spacing:.2em;color:var(--muted);
}

/* ========== 5 祝福牆 ========== */
#gbForm{display:grid;gap:12px;margin-bottom:clamp(28px,5vh,44px);}
#gbForm input,#gbForm textarea{
  width:100%;padding:13px 15px;border:1px solid var(--edge);border-radius:2px;
  background:rgba(255,255,255,.6);font:inherit;font-size:.94rem;color:var(--ink);
  letter-spacing:.05em;
}
#gbForm textarea{min-height:110px;resize:vertical;line-height:1.9;}
#gbForm input:focus,#gbForm textarea:focus{outline:1px solid var(--thread);border-color:var(--thread);}
#gbForm .actions{display:flex;justify-content:flex-end;align-items:center;gap:14px;}
#gbMsg{font-size:.76rem;letter-spacing:.14em;color:var(--muted);}
#gbList{display:grid;gap:14px;list-style:none;}
#gbList li{
  padding:18px 20px;background:rgba(255,255,255,.55);
  border:1px solid var(--edge);border-radius:3px;
  border-left:2px solid var(--thread);
}
.gb-name{font-family:"Noto Serif TC",serif;font-size:.88rem;letter-spacing:.2em;}
.gb-time{font-size:.66rem;letter-spacing:.14em;color:var(--muted);margin-left:10px;}
.gb-text{margin-top:8px;font-size:.94rem;line-height:2;color:var(--muted);letter-spacing:.05em;white-space:pre-wrap;}
.gb-empty{text-align:center;color:var(--muted);font-size:.88rem;letter-spacing:.14em;padding:30px 0;}

/* ========== 6 倒數 ========== */
#count{background:var(--night);color:var(--paper);text-align:center;}
#count .sec-title{color:var(--paper);}
#countGrid{
  display:flex;justify-content:center;gap:clamp(18px,6vw,54px);flex-wrap:wrap;
}
.cell{min-width:64px;}
.cell b{
  display:block;font-family:"Noto Serif TC",serif;font-weight:300;
  font-size:clamp(2.1rem,8vw,3.4rem);color:var(--gold);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
.cell span{
  display:block;margin-top:8px;font-size:.66rem;
  letter-spacing:.36em;text-indent:.36em;color:rgba(242,235,221,.6);
}
#countNote{margin-top:clamp(26px,5vh,44px);font-size:.8rem;letter-spacing:.26em;color:rgba(242,235,221,.72);}

/* ========== 7 頁尾 ========== */
#foot{
  background:#0A0D18;color:rgba(242,235,221,.72);text-align:center;
  padding:clamp(52px,9vh,88px) clamp(20px,6vw,64px) calc(clamp(52px,9vh,88px) + env(safe-area-inset-bottom));
}
#foot .knotmark{color:var(--thread);font-size:1.1rem;letter-spacing:.5em;text-indent:.5em;}
#foot .names{
  margin-top:20px;font-family:"Noto Serif TC",serif;font-size:1rem;
  letter-spacing:.44em;text-indent:.44em;color:var(--paper);
}
#foot .contacts{margin-top:22px;font-size:.82rem;line-height:2.2;letter-spacing:.1em;}
#foot .contacts a{color:var(--gold);text-decoration:none;}
#foot .btn{margin-top:26px;border-color:rgba(201,162,39,.6);color:var(--gold);}
#foot .btn:hover,#foot .btn:focus-visible{background:var(--gold);color:#0A0D18;}
#foot .fine{margin-top:30px;font-size:.64rem;letter-spacing:.2em;color:rgba(242,235,221,.34);}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  .reveal{opacity:1;transform:none;}
}
</style>
</head>
<body>

<!-- ============ 0 封面 ============ -->
<div id="cover">
  <div id="coverTitle">三生三世</div>

  <div id="coverDate">
    <div class="d" id="coverDateText">2027 . 04 . 17</div>
    <div class="sub" id="coverDateSub">星期六 · 午宴 · 川門子</div>
  </div>

  <div id="coverNames">新郎 ＆ 新娘</div>

  <button id="open">翻開這本書</button>
  <div id="coverLoad">繪本準備中…</div>
</div>

<!-- 常駐 RSVP：任何時候都能直接跳表單，不必滑完整本書 -->
<a id="rsvpFab" href="#rsvp">出席回覆</a>

<main>

  <!-- ============ 1 三生三世繪本 ============ -->
  <section id="chapters" aria-label="三生三世繪本">
    <div id="book">
      <div id="page">
        <canvas id="stage"></canvas>
        <div id="grain"></div>
        <div id="vignette"></div>
        <div id="spine"></div>

        <div id="titleWrap">
          <div id="era" class="vtext">第一世</div>
          <div id="chapter" class="vtext">相識</div>
          <div id="place" class="vtext">陽明山 · 至善園</div>
        </div>

        <p id="line">錯身的那一眼<br>同心結落在橋欄上</p>

        <nav id="nav" aria-label="章節導覽">
          <button class="knot" data-i="0" aria-label="第一世 相識" aria-current="true"><i></i></button>
          <span class="thread"></span>
          <button class="knot" data-i="1" aria-label="第二世 相知"><i></i></button>
          <span class="thread"></span>
          <button class="knot" data-i="2" aria-label="第三世 相戀"><i></i></button>
        </nav>

        <div id="hint">向下捲動翻頁 · 移動游標看見深度</div>
      </div>
    </div>
  </section>

  <!-- ============ 2 我們的時間軸 ============ -->
  <section id="story" class="sheet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">OUR STORY</div>
        <h2 class="sec-title">我們的時間軸</h2>
      </header>
      <ol id="tl"><!-- timeline.js --></ol>
    </div>
  </section>

  <!-- ============ 3 婚禮資訊 ============ -->
  <section id="info" class="sheet sheet--alt">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">DETAILS</div>
        <h2 class="sec-title">婚禮資訊</h2>
      </header>
      <!-- 純文字呈現，可長按複製；地圖只是加分項 -->
      <dl class="info" id="infoList"><!-- site.js --></dl>
      <div class="map-actions" id="mapActions"><!-- site.js --></div>
      <div id="mapFrame" hidden><!-- site.js --></div>
    </div>
  </section>

  <!-- ============ 4 RSVP ============ -->
  <section id="rsvp" class="sheet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">RSVP</div>
        <h2 class="sec-title">出席回覆</h2>
      </header>
      <div id="rsvpBox"><!-- rsvp.js --></div>
      <p class="deadline" id="rsvpDeadline"></p>
    </div>
  </section>

  <!-- ============ 5 祝福牆 ============ -->
  <section id="guestbook" class="sheet sheet--alt">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">WISHES</div>
        <h2 class="sec-title">祝福牆</h2>
      </header>
      <form id="gbForm" hidden>
        <label class="sr-only" for="gbName">稱呼</label>
        <input id="gbName" name="name" type="text" maxlength="20" placeholder="你的稱呼" required>
        <label class="sr-only" for="gbText">祝福</label>
        <textarea id="gbText" name="text" maxlength="200" placeholder="寫下想說的話…" required></textarea>
        <div class="actions">
          <span id="gbMsg" role="status"></span>
          <button class="btn btn--solid" type="submit">送出祝福</button>
        </div>
      </form>
      <ul id="gbList"><!-- guestbook.js --></ul>
    </div>
  </section>

  <!-- ============ 6 倒數 ============ -->
  <section id="count" class="sheet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">COUNTDOWN</div>
        <h2 class="sec-title">距離婚禮</h2>
      </header>
      <div id="countGrid" role="timer" aria-live="off">
        <div class="cell"><b id="cD">—</b><span>天</span></div>
        <div class="cell"><b id="cH">—</b><span>時</span></div>

  var m=sectionMetrics();

      ctx.beginPath(); ctx.rect(X,Y,W,H); ctx.clip();
      var s=Math.max(W/img.width,H/img.height);
      ctx.drawImage(img,X+(W-img.width*s)/2,Y+(H-img.height*s)/2,img.width*s,img.height*s);
      ctx.restore();
      t.needsUpdate=true;
    };
    img.src=url;
  }
  return t;
}

function fit(mesh,z,over){
  over=over||1.18;
  var d=CAM_Z-z;
  var h=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*d;
  var w=h*camera.aspect;
  var tw=TW/TH;
  var pw=w*over, ph=pw/tw;
  if(ph<h*over){ ph=h*over; pw=ph*tw; }
  mesh.scale.set(pw,ph,1);
}

function buildWorlds(){
  groups = WORLDS.map(function(wd,wi){
    var g=new THREE.Group();
    g.visible = wi===cur;          /* 載入期間已捲到別世也能正確顯示 */
    wd.layers=[];

    wd.build.forEach(function(spec){
      var m=new THREE.Mesh(
        new THREE.PlaneGeometry(1,1),
        new THREE.MeshBasicMaterial({map:texFrom(spec.draw),transparent:true,depthWrite:false})
      );
      m.position.z=spec.z;
      m.userData.p=spec.p;
      m.userData.z=spec.z;
      g.add(m); wd.layers.push(m);
    });

    /* 照片層在 near 與 fore 之間 */
    var pm=new THREE.Mesh(
      new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({map:photoTexture(wd.photo),transparent:true,depthWrite:false})
    );
    pm.position.set(0,0,-1.9);
    pm.rotation.z=THREE.MathUtils.degToRad(wd.photoTilt);
    pm.userData.p=.78; pm.userData.z=-1.9; pm.userData.photo=true;
    g.add(pm); wd.layers.push(pm);

    scene.add(g);
    return g;
  });
}

function resize(){
  if(!renderer) return;
  var w=canvas.clientWidth, h=canvas.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  WORLDS.forEach(function(wd){
    wd.layers.forEach(function(m){
      fit(m,m.userData.z, m.userData.photo?0.62:1.18);
    });
  });
}

/* ---------- 傾斜（游標／陀螺儀） ---------- */
var px=0,py=0,tx=0,ty=0;
function pointer(x,y){
  var r=canvas.getBoundingClientRect();
  if(!r.width||!r.height) return;
  tx=((x-r.left)/r.width -.5)*2;
  ty=((y-r.top)/r.height-.5)*2;
}
addEventListener('pointermove',function(e){ pointer(e.clientX,e.clientY); });
addEventListener('touchmove',function(e){
  if(e.touches[0]) pointer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});

function onOrient(e){
  if(e.gamma==null) return;
  tx=Math.max(-1,Math.min(1,e.gamma/26));
  ty=Math.max(-1,Math.min(1,(e.beta-45)/26));
}
/* iOS 需在使用者手勢後請求權限；由封面按鈕呼叫 */
api.enableTilt=function(){
  var DOE=window.DeviceOrientationEvent;
  if(!DOE) return;
  if(typeof DOE.requestPermission==='function'){
    DOE.requestPermission().then(function(state){
      if(state==='granted') addEventListener('deviceorientation',onOrient);
    }).catch(function(){});
  }else{
    addEventListener('deviceorientation',onOrient);
  }
};

/* ---------- 迴圈 ---------- */
var clock;
function tick(){
  requestAnimationFrame(tick);
  var t=clock.getElapsedTime();

  px+=(tx-px)*.055; py+=(ty-py)*.055;

  if(prog<1){
    prog=Math.min(1,prog+(reduce?.2:.028));
    if(prog>=1 && groups[from]){ groups[from].visible=false; animating=false; }
  }
  var e=prog<1 ? 1-Math.pow(1-prog,3) : 1;

  groups.forEach(function(g,gi){
    if(!g.visible) return;
    var incoming = gi===cur;
    var a = incoming ? e : 1-e;

    g.rotation.y = px*0.11;
    g.rotation.x = -py*0.07;
    g.position.z = incoming ? (1-e)*-6 : e*5;

    g.children.forEach(function(m,li){
      var p=m.userData.p;
      var drift = reduce?0:Math.sin(t*.28+li)*0.012*p;
      m.position.x = -px*p*0.95 + drift;
      m.position.y =  py*p*0.62;
      var denom = (1-li*0.045)||1;
      var stagger=Math.max(0,Math.min(1,(e-li*0.045)/denom));
      m.material.opacity = incoming ? stagger : a;
    });
  });

  renderer.render(scene,camera);
}

/* ---------- 啟動 ---------- */
function start(){
  if(!bootGL()){
    /* 低階裝置／WebGL 失敗 → 靜態 CSS 版，翻頁與文字照常運作 */
    pageEl.classList.add('nogl');
    pageEl.style.setProperty('--fallback',WORLDS[0].fallback);
    api.ready=true;
    document.dispatchEvent(new CustomEvent('book:ready',{detail:{gl:false}}));
    return;
  }
  buildWorlds();
  new ResizeObserver(resize).observe(pageEl);
  addEventListener('resize',resize);
  resize();
  clock=new THREE.Clock();
  tick();
  api.ready=true;
  document.dispatchEvent(new CustomEvent('book:ready',{detail:{gl:true}}));
}

start();

})();
</script>

<script>
/* ===== js/timeline.js ===== */
/* =========================================================================
   timeline.js — 我們的時間軸（紅線串起）
   資料來源：data.js 的 SITE.timeline
   ========================================================================= */
(function () {
'use strict';

var items = (window.SITE && window.SITE.timeline) || [];
var ol = document.getElementById('tl');
if (!ol) return;

items.forEach(function (it, i) {
  var li = document.createElement('li');

  var d = document.createElement('div');
  d.className = 'tl-date';

  var h = document.createElement('h3');

  h.textContent = it.label || '';

  var p = document.createElement('p');

  p.textContent = it.text || '';

  li.appendChild(d); li.appendChild(h); li.appendChild(p);

});

/* 捲到才淡入（.reveal 由 site.js 的 observer 統一接手，這裡只負責產生節點） */
})();

<script>
/* ===== js/rsvp.js ===== */
/* =========================================================================
   rsvp.js — 出席回覆
   有填 SITE.rsvp.url 就嵌入表單；沒填則顯示備援聯絡方式（不留白）
   ========================================================================= */
(function () {
'use strict';

var S = window.SITE || {};
var cfg = S.rsvp || {};
var box = document.getElementById('rsvpBox');
var dl  = document.getElementById('rsvpDeadline');
if (!box) return;

if (cfg.url) {
  var f = document.createElement('iframe');
  f.src = cfg.url;
  f.title = '出席回覆表單';
  f.loading = 'lazy';
  f.setAttribute('referrerpolicy', 'no-referrer');
  box.appendChild(f);
} else {
  var contacts = (cfg.contacts || []).filter(function (c) { return c && (c.name || c.phone); });
  var html =
    '<div class="fallback">' +
      '<p>線上回覆表單建置中。<br>' +
      (contacts.length
        ? '在開放前，可直接聯絡我們：'
        : '在開放前，請直接與新人聯繫。') +
      '</p>';
  if (contacts.length) {
    html += '<p style="margin-top:14px">' + contacts.map(function (c) {
      var name = esc(c.name || '新人');
      return c.phone
        ? name + '　<a href="tel:' + esc(c.phone) + '" style="color:var(--thread)">' + esc(c.phone) + '</a>'
        : name;
    }).join('<br>') + '</p>';
  }
  html += '<p class="note">待辦：建立 Google Form / Tally，把網址填進 data.js 的 rsvp.url</p></div>';
  box.innerHTML = html;
}

if (dl && cfg.deadline) {
  var p = String(cfg.deadline).split('-');
  if (p.length === 3) {
    dl.textContent = '請於 ' + p[0] + ' 年 ' + (+p[1]) + ' 月 ' + (+p[2]) + ' 日前回覆，方便我們安排席位';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
})();
</script>

<script>
/* ===== js/guestbook.js ===== */
/* =========================================================================
   guestbook.js — 祝福牆（Firebase Firestore）
   未設定 SITE.guestbook.firebase 時：隱藏表單、顯示說明，不報錯
   Firestore 規則建議（Console → 規則）：
     match /wishes/{id} {
       allow read: if true;
       allow create: if request.resource.data.keys().hasOnly(['name','text','createdAt'])
                     && request.resource.data.name is string
                     && request.resource.data.name.size() <= 20
                     && request.resource.data.text is string
                     && request.resource.data.text.size() <= 200;
       allow update, delete: if false;
     }
   ========================================================================= */
(function () {
'use strict';

var S    = window.SITE || {};
var cfg  = (S.guestbook || {}).firebase;
var form = document.getElementById('gbForm');
var list = document.getElementById('gbList');
var msg  = document.getElementById('gbMsg');
if (!list) return;

if (!cfg) {
  list.innerHTML = '<li class="gb-empty">祝福牆準備中，敬請期待。</li>';
  return;
}

var SDK = 'https://www.gstatic.com/firebasejs/9.23.0/';
load(SDK + 'firebase-app-compat.js')
  .then(function () { return load(SDK + 'firebase-firestore-compat.js'); })
  .then(init)
  .catch(function () {
    list.innerHTML = '<li class="gb-empty">祝福牆暫時無法載入。</li>';
  });

function load(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

function init() {
  var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
  var db  = firebase.firestore(app);
  var col = db.collection('wishes');

  form.hidden = false;

  col.orderBy('createdAt', 'desc').limit(100).onSnapshot(function (snap) {
    if (snap.empty) {
      list.innerHTML = '<li class="gb-empty">還沒有留言，來當第一個吧。</li>';
      return;
    }
    list.innerHTML = '';
    snap.forEach(function (doc) {
      var d = doc.data();
      var li = document.createElement('li');

      var head = document.createElement('div');
      var n = document.createElement('span');
      n.className = 'gb-name';
      n.textContent = d.name || '匿名';
      head.appendChild(n);

      if (d.createdAt && d.createdAt.toDate) {
        var t = document.createElement('span');
        t.className = 'gb-time';
        t.textContent = fmt(d.createdAt.toDate());
        head.appendChild(t);
      }

      var p = document.createElement('p');
      p.className = 'gb-text';
      p.textContent = d.text || '';        // textContent → 天然防注入

      li.appendChild(head); li.appendChild(p);
      list.appendChild(li);
    });
  }, function () {
    list.innerHTML = '<li class="gb-empty">祝福牆暫時無法載入。</li>';
  });

  var last = 0;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var now = Date.now();
    if (now - last < 20000) { say('請稍候再送出一則'); return; }

    var name = form.name.value.trim().slice(0, 20);
    var text = form.text.value.trim().slice(0, 200);
    if (!name || !text) { say('請填寫稱呼與祝福'); return; }

    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true; say('送出中…');

    col.add({
      name: name,
      text: text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function () {
      last = now;
      form.reset();
      say('謝謝你的祝福');
    }).catch(function () {
      say('送出失敗，請稍後再試');
    }).then(function () {
      btn.disabled = false;
    });
  });

  function say(s) {
    msg.textContent = s;
    clearTimeout(say.t);
    say.t = setTimeout(function () { msg.textContent = ''; }, 4000);
  }
}

function fmt(d) {
  var p = function (n) { return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
}
})();
</script>

<script>
/* ===== js/site.js ===== */
/* =========================================================================
   site.js — 封面、婚禮資訊、倒數、加入行事曆、捲動淡入、RSVP 浮動鈕
   ========================================================================= */
(function () {
'use strict';

var S = window.SITE || {};
var D = S.date || {}, V = S.venue || {}, C = S.couple || {};
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 封面期間鎖捲動；用 JS 加上，萬一 JS 掛掉頁面仍可捲動 */
document.body.classList.add('locked');

/* ---------- 小工具 ---------- */
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
/* 婚禮時刻（台北 +08:00）；time 省略時用觀禮時間 */
function weddingAt(time) {
  var t = time || D.ceremony || '11:30';
  return new Date(D.iso + 'T' + (t.length === 5 ? t : '11:30') + ':00+08:00');
}
var startAt = weddingAt(D.ceremony);
var endAt   = weddingAt(D.endTime);
var dateOK  = !isNaN(startAt.getTime());

/* ---------- 0 封面 ---------- */
(function cover() {
  var el = $('cover'); if (!el) return;

  if (D.display) $('coverDateText').textContent = D.display;
  $('coverDateSub').textContent =
    [D.weekday, D.form, V.name].filter(Boolean).join(' · ');
  if (C.display) {
    $('coverNames').textContent = C.display;
    if ($('footNames')) $('footNames').textContent = C.display;
  }

  var load = $('coverLoad');
  var btn  = $('open');
  var ready = false;

  document.addEventListener('book:ready', function () {
    ready = true;
    load.textContent = '';
  });
  /* 保險：3 秒後就算還沒好也放行，長輩不會卡在封面 */
  setTimeout(function () { if (!ready) load.textContent = ''; }, 3000);

  btn.addEventListener('click', function () {
    el.classList.add('gone');
    document.body.classList.remove('locked');
    if (window.BOOK && window.BOOK.enableTilt) window.BOOK.enableTilt();  /* iOS 陀螺儀需手勢 */
    var fab = $('rsvpFab');
    if (fab) setTimeout(function () { fab.classList.add('show'); }, 600);
  });
})();

/* ---------- 3 婚禮資訊 ---------- */
(function info() {
  var dl = $('infoList'); if (!dl) return;
  var tbd = '<span class="tbd">待補</span>';

  function row(label, htmlValue, copyText) {
    var d = document.createElement('div');
    d.className = 'row reveal';
    d.innerHTML =
      '<dt>' + label + '</dt><dd>' + htmlValue + '</dd>' +
      (copyText ? '<button class="copy" type="button">複製</button>' : '<span></span>');
    if (copyText) {
      d.querySelector('.copy').addEventListener('click', function () {
        var b = this;
        copy(copyText).then(function () {
          b.textContent = '已複製'; b.classList.add('done');
          setTimeout(function () { b.textContent = '複製'; b.classList.remove('done'); }, 2000);
        });
      });
    }
    dl.appendChild(d);
  }

  row('日期',
    '<span class="big">' + (D.display || '') + '</span>' +
    '<span class="sub">' + [D.roc, D.weekday, D.form].filter(Boolean).join(' · ') + '</span>');

  row('時間',
    '<span class="big">' + (D.ceremony || '') + ' 觀禮</span>' +
    '<span class="sub">' + (D.seating ? D.seating + ' 入席' : '') + '</span>');

  var place = '<span class="big">' + esc(V.name || '') + (V.hall ? '　' + esc(V.hall) : '') + '</span>';
  place += '<span class="sub">' + (V.address ? esc(V.address) : tbd) + '</span>';
  row('地點', place, V.address ? (V.name + ' ' + V.address) : null);

  if (V.phone) {
    row('電話', '<a href="tel:' + esc(V.phone) + '">' + esc(V.phone) + '</a>', V.phone);
  }

  var transit = (V.transit || []).filter(Boolean);
  row('交通', transit.length ? transit.map(esc).join('<br>') : tbd);
  row('停車', V.parking ? esc(V.parking) : tbd);

  /* 地圖是加分項；沒有地址就只用店名查詢 */
  var q = V.address || V.mapQuery || V.name;
  var acts = $('mapActions');
  if (q && acts) {
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '在 Google 地圖開啟';
    acts.appendChild(a);

    var frame = $('mapFrame');
    frame.hidden = false;
    var f = document.createElement('iframe');
    f.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed';
    f.title = '婚宴地點地圖';
    f.loading = 'lazy';
    f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    frame.appendChild(f);
  }
})();

/* ---------- 6 倒數 ---------- */
(function countdown() {
  var g = $('countGrid'); if (!g || !dateOK) return;
  var note = $('countNote');
  var els = { d: $('cD'), h: $('cH'), m: $('cM'), s: $('cS') };

  function paint() {
    var diff = startAt - Date.now();
    if (diff <= 0) {
      els.d.textContent = els.h.textContent = els.m.textContent = els.s.textContent = '0';
      note.textContent = '今天，謝謝你來。';
      return true;
    }
    var s = Math.floor(diff / 1000);
    els.d.textContent = Math.floor(s / 86400);
    els.h.textContent = pad(Math.floor(s / 3600) % 24);
    els.m.textContent = pad(Math.floor(s / 60) % 60);
    els.s.textContent = pad(s % 60);
    note.textContent = (D.display || '') + '　' + (V.name || '') + (D.form ? ' · ' + D.form : '');
    return false;
  }
  if (paint()) return;
  var timer = setInterval(function () { if (paint()) clearInterval(timer); }, 1000);
})();

/* ---------- 7 頁尾：聯絡人 + 加入行事曆 ---------- */
(function footer() {
  var box = $('footContacts');
  var contacts = ((S.rsvp || {}).contacts || []).filter(function (c) { return c && (c.name || c.phone); });
  if (box) {
    box.innerHTML = contacts.length
      ? contacts.map(function (c) {
          var n = esc(c.name || '新人');
          return c.phone ? n + '　<a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a>' : n;
        }).join('<br>')
      : '';
  }

  var btn = $('icsBtn');
  if (!btn) return;
  if (!dateOK) { btn.setAttribute('aria-disabled', 'true'); return; }

  function z(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
           pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
  }
  var title = (C.display ? C.display + ' ' : '') + '婚禮';
  var loc   = [V.name, V.hall, V.address].filter(Boolean).join(' ');
  var ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//wedding//invitation//ZH',
    'BEGIN:VEVENT',
    'UID:' + D.iso + '-wedding@invitation',
    'DTSTAMP:' + z(new Date()),
    'DTSTART:' + z(startAt),
    'DTEND:' + z(isNaN(endAt.getTime()) ? new Date(startAt.getTime() + 3 * 3600e3) : endAt),
    'SUMMARY:' + title,
    'LOCATION:' + loc,
    'DESCRIPTION:' + [D.ceremony ? D.ceremony + ' 觀禮' : '', D.seating ? D.seating + ' 入席' : ''].filter(Boolean).join('，'),
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');

  btn.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  btn.download = 'wedding-' + D.iso + '.ics';
})();

/* ---------- 捲動淡入 ---------- */
(function reveal() {
  var els = document.querySelectorAll('.reveal');
  if (reduce || !('IntersectionObserver' in window)) {
    Array.prototype.forEach.call(els, function (e) { e.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  Array.prototype.forEach.call(els, function (e) { io.observe(e); });
})();

/* ---------- 共用 ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function (res) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); res();
  });
}
})();
</script>
