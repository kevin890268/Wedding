<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們的故事 · 婚禮邀請 2027.04.17</title>
<meta name="description" content="2027.04.17 川門子 午宴 — 我們的故事電子喜帖">
<meta name="theme-color" content="#0E1220">

<!-- 分享用 OG（圖片路徑在 data.js 的 share.image，換好圖後把下面 og:image 一併改成絕對網址） -->
<meta property="og:type" content="website">
<meta property="og:title" content="我們的故事 · 我們的婚禮">
<meta property="og:description" content="2027.04.17 川門子 午宴">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ============ 0 封面 ============ -->
<div id="cover">
  <div id="coverTitle">我們的故事</div>

  <div id="coverDate">
    <div class="d" id="coverDateText">2027 . 04 . 17</div>
    <div class="sub" id="coverDateSub">星期六 · 午宴 · 川門子</div>
  </div>

  <div id="coverNames">新郎 ＆ 新娘</div>

  <button id="open">翻開這本書</button>
  <div id="coverLoad">繪本準備中…</div>
</div>

<!-- 常駐 RSVP：任何時候都能直接跳表單，不必滑完整本書 -->
<a id="rsvpFab" href="#rsvp">出席回覆</a>

<main>

  <!-- ============ 1 我們的故事（時間軸繪本） ============ -->
  <section id="chapters" aria-label="我們的故事">
    <div id="book">
      <div id="page">
        <canvas id="stage"></canvas>
        <div id="grain"></div>
        <div id="vignette"></div>
        <div id="spine"></div>

        <div id="titleWrap">
          <div id="era" class="vtext">第一世</div>
          <div id="chapter" class="vtext">相識</div>
          <div id="place" class="vtext">陽明山 · 至善園</div>
        </div>

        <p id="line">錯身的那一眼<br>同心結落在橋欄上</p>

        <nav id="rail" aria-label="時間軸"><ol></ol></nav>

        <div id="hint">向下捲動走過時間 · 移動游標看見深度</div>
      </div>
    </div>
  </section>

  <!-- ============ 3 婚禮資訊 ============ -->
  <section id="info" class="sheet sheet--alt">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">DETAILS</div>
        <h2 class="sec-title">婚禮資訊</h2>
      </header>
      <!-- 純文字呈現，可長按複製；地圖只是加分項 -->
      <dl class="info" id="infoList"><!-- site.js --></dl>
      <div class="map-actions" id="mapActions"><!-- site.js --></div>
      <div id="mapFrame" hidden><!-- site.js --></div>
    </div>
  </section>

  <!-- ============ 4 RSVP ============ -->
  <section id="rsvp" class="sheet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">RSVP</div>
        <h2 class="sec-title">出席回覆</h2>
      </header>
      <div id="rsvpBox"><!-- rsvp.js --></div>
      <p class="deadline" id="rsvpDeadline"></p>
    </div>
  </section>

  <!-- ============ 5 祝福牆 ============ -->
  <section id="guestbook" class="sheet sheet--alt">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">WISHES</div>
        <h2 class="sec-title">祝福牆</h2>
      </header>
      <form id="gbForm" hidden>
        <label class="sr-only" for="gbName">稱呼</label>
        <input id="gbName" name="name" type="text" maxlength="20" placeholder="你的稱呼" required>
        <label class="sr-only" for="gbText">祝福</label>
        <textarea id="gbText" name="text" maxlength="200" placeholder="寫下想說的話…" required></textarea>
        <div class="actions">
          <span id="gbMsg" role="status"></span>
          <button class="btn btn--solid" type="submit">送出祝福</button>
        </div>
      </form>
      <ul id="gbList"><!-- guestbook.js --></ul>
    </div>
  </section>

  <!-- ============ 6 倒數 ============ -->
  <section id="count" class="sheet">
    <div class="wrap">
      <header class="sec-head reveal">
        <div class="sec-kicker">COUNTDOWN</div>
        <h2 class="sec-title">距離婚禮</h2>
      </header>
      <div id="countGrid" role="timer" aria-live="off">
        <div class="cell"><b id="cD">—</b><span>天</span></div>
        <div class="cell"><b id="cH">—</b><span>時</span></div>
        <div class="cell"><b id="cM">—</b><span>分</span></div>
        <div class="cell"><b id="cS">—</b><span>秒</span></div>
      </div>
      <p id="countNote"></p>
    </div>
  </section>

</main>

<!-- ============ 7 頁尾 ============ -->
<footer id="foot">
  <div class="knotmark">結</div>
  <div class="names" id="footNames">新郎 ＆ 新娘</div>
  <div class="contacts" id="footContacts"></div>
  <a class="btn" id="icsBtn" href="#" download="wedding.ics">加入行事曆</a>
  <div class="fine">我們的故事 · 電子喜帖</div>
</footer>

<script src="data.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/book.js"></script>

<script src="js/timeline.js"></script>

<script src="js/rsvp.js"></script>

<script src="js/guestbook.js"></script>

<script src="js/site.js"></script>
</body>
</html>
